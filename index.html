<!DOCTYPE html>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7f9;--card:#fff;--tx:#1d2330;--mut:#6b7280;--line:#dfe3ea;--pri:#2457d6;--ok:#16794a;--okbg:#e3f5ec;--no:#b42318;--nobg:#fde8e6}
@media(prefers-color-scheme:dark) and (max-width:0px){:root:not([data-theme="light"]){--bg:#14171c;--card:#1e232b;--tx:#e8ebf0;--mut:#9aa3b2;--line:#323946;--pri:#6c93ff;--ok:#5bd39a;--okbg:#14382a;--no:#ff8a80;--nobg:#42201d}}
:root[data-theme="dark"]{--bg:#14171c;--card:#1e232b;--tx:#e8ebf0;--mut:#9aa3b2;--line:#323946;--pri:#6c93ff;--ok:#5bd39a;--okbg:#14382a;--no:#ff8a80;--nobg:#42201d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.65 -apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
main{max-width:680px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:8px 0 4px}h2{font-size:15px;margin:22px 0 8px;color:var(--mut);font-weight:600}
.sub{color:var(--mut);font-size:14px;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:12px}
.row{display:flex;flex-wrap:wrap;gap:8px}
.chip{flex:1 1 auto;min-width:56px;text-align:center;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--tx);font:inherit;cursor:pointer}
.chip.on{border-color:var(--pri);background:var(--pri);color:#fff}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:12px;background:var(--pri);color:#fff;font:inherit;font-weight:600;cursor:pointer;margin-top:16px}
.btn.sec{background:var(--card);color:var(--tx);border:1.5px solid var(--line)}
.btn:disabled{opacity:.4}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 12px}.bar i{display:block;height:100%;background:var(--pri)}
.meta{display:flex;justify-content:space-between;color:var(--mut);font-size:13px}
.q{font-size:17px;font-weight:600;margin:6px 0 14px}.st{display:block;font-weight:400;font-size:16px;margin-top:4px}
.opt{display:block;width:100%;text-align:left;padding:12px 14px;margin-bottom:8px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--tx);font:inherit;cursor:pointer}
.opt b{margin-right:8px;color:var(--mut)}
.opt.sel{border-color:var(--pri);box-shadow:inset 0 0 0 1px var(--pri)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.no{border-color:var(--no);background:var(--nobg)}
.fb{margin-top:6px;font-weight:600}.fb.ok{color:var(--ok)}.fb.no{color:var(--no)}
.nav{display:flex;gap:8px}.nav .btn{margin-top:12px}
.score{text-align:center;padding:10px 0}.score .n{font-size:48px;font-weight:700;line-height:1.1}
.tag{font-size:12px;color:var(--mut);border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-left:6px}
.rv{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.grid button{width:34px;height:34px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:var(--tx);font:13px inherit;cursor:pointer}.grid .d{background:var(--pri);color:#fff;border-color:var(--pri)}.grid .c{outline:2px solid var(--tx)}
:root{--bg:#eef6fd;--card:#ffffff;--tx:#1e3248;--mut:#66798f;--line:#d4e4f3;--pri:#2a75c7;--ok:#23875c;--okbg:#e6f6ee;--no:#d64545;--nobg:#fdeceb;color-scheme:light}
@media(prefers-color-scheme:dark) and (max-width:0px){:root:not([data-theme="light"]){--bg:#15131f;--card:#1e1b2b;--tx:#ebe8f5;--mut:#a29cba;--line:#342f48;--pri:#b4a6ff;--ok:#5fd1a0;--okbg:#143627;--no:#ff8f86;--nobg:#3d1f1f}}
:root[data-theme="dark"]{--bg:#15131f;--card:#1e1b2b;--tx:#ebe8f5;--mut:#a29cba;--line:#342f48;--pri:#b4a6ff;--ok:#5fd1a0;--okbg:#143627;--no:#ff8f86;--nobg:#3d1f1f}
h1,.q{font-family:"Noto Serif TC","Songti TC","PMingLiU",serif}
h1{font-size:27px;line-height:1.35;margin:0 0 6px;padding-top:14px;border-top:5px solid var(--pri)}
h2{font-size:14px;color:var(--tx);margin:24px 0 8px;font-weight:700}
.card,.opt,.chip,.btn,.grid button{border-radius:8px}
.card{padding:18px 16px;box-shadow:none}
.q{font-size:18px;font-weight:600;line-height:1.85;margin:2px 0 16px}
.st{font-weight:400;font-size:17px;line-height:1.8;margin-top:2px}
.chip{padding:12px;font-weight:600}
.chip.on{background:var(--pri);border-color:var(--pri);color:var(--bg)}
.btn{background:var(--pri);color:var(--bg);padding:15px}
.btn.sec{background:transparent;color:var(--tx)}
.opt{display:flex;gap:12px;align-items:flex-start;padding:11px 12px}
.opt b{flex:none;width:28px;height:28px;margin:0;border:1.5px solid var(--mut);border-radius:50%;display:grid;place-items:center;font-size:13px;color:var(--mut)}
.opt.sel{box-shadow:none}.opt.sel b{background:var(--pri);border-color:var(--pri);color:var(--bg)}
.opt.ok b{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.no b{background:var(--no);border-color:var(--no);color:#fff}
.bar{height:4px}.bar i{background:var(--pri)}
.grid .d{background:var(--pri);color:var(--bg)}
.score{padding:14px 0 6px}
.score .n{display:inline-block;font:700 44px/1 "Noto Serif TC",serif;color:var(--no);border:3px solid var(--no);border-radius:50%;padding:26px 34px;transform:rotate(-5deg);margin:8px 0 18px}
.fb.ok{color:var(--ok)}.fb.no{color:var(--no)}
.chip.back{flex:none;min-width:0;padding:6px 10px;font-size:13px}
.ov{position:fixed;inset:0;background:rgba(10,8,25,.55);display:grid;place-items:center;padding:20px;z-index:99}
.ov .box{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:20px;max-width:340px;width:100%}
.ov .box p{margin:0 0 4px;font-weight:600}
.ov .nav .btn{margin-top:14px}
.cat{font-size:12px;color:var(--pri);font-weight:700;margin-bottom:6px}.chip.sm{font-size:14px;padding:9px 10px;font-weight:500}
.nt{margin:8px 0 0;padding-left:20px}.nt li{margin:7px 0;line-height:1.7}.hint{margin-top:14px;border-top:1px solid var(--line);padding-top:10px;font-size:15px}.hint summary{cursor:pointer;color:var(--pri);font-weight:600}
button:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
const BANK=[{"id":"113-1","year":"113","n":1,"q":"特別準備金的提存，在人身保險業對保險期間一年以下之保險自留業務提存特別準備金，因應未來發生重大事故所需支應之巨額賠款而提存。請問有關重大事故的規範，下列敘述何者正確？","o":["指符合政府發布重大災情，單一事故發生時，只須符合個別保險公司累計各險別自留賠款合計達新臺幣（下同）5,000 萬元","指符合政府發布重大災情，單一事故發生時，只須符合全體人身保險業各險別合計應賠款總金額達 20 億元以上者","指符合政府發布重大災情，單一事故發生時，個別公司累計各險別自留賠款合計達 3,000 萬元，且全體人身保險業各險別合計應賠款總金額達 10 億元以上者","指符合政府發布重大災情，單一事故發生時，個別公司累計各險別自留賠款合計達 3,000 萬元，或是全體人身保險業各險別合計應賠款總金額達 10 億元以上者"],"a":2,"c":"準備金、費率與再保"},{"id":"113-2","year":"113","n":2,"q":"下列敘述何者正確？①目前保險公司採用第六回經驗生命表設計壽險商品及計算保費②目前保險公司採用第五回經驗生命表設計壽險商品及計算保費③第六回經驗生命表死亡率較第五回經驗生命表低④目前保險公司採用第二回年金生命表設計年金險商品及計算保費⑤第一回年金生命表所計算之保費實有高估超收之嫌，採第二回年金生命表始能反映保險業面臨的長壽風險","o":["②④⑤","①③④","②④","①③⑤"],"a":1,"c":"準備金、費率與再保"},{"id":"113-3","year":"113","n":3,"q":"某甲於 2015 年投保終身壽險新臺幣（下同）100 萬元，後因移居他國未繳保費致該保單於 2023 年 9 月停效，並於 2024 年 1 月辦理復效。惟某甲竟於復效後 2 個月自殺而成完全失能，下列敘述何者正確？","o":["保險公司返還保單價值準備金","保險公司需理賠 100 萬元","保險公司僅返還所繳保費加計利息","保險公司無需給付"],"a":3,"c":"契約條款與法規"},{"id":"113-4","year":"113","n":4,"q":"部分保單設有「豁免保險費附加條款」，倘附加條款規定：本附約所稱「被保險人」係指主契約之要保人，且不得與主契約之被保險人同一人。下列敘述何者錯誤？","o":["主契約之要保人為父，被保險人為子的個人保單，而附約之被保險人為父","主契約之要保人為父，被保險人為配偶及子女的家庭型保單，而附約之被保險人為父","一般而言豁免保費附加條款的保險事故限於被保險人身故","本附約是為了保障主契約之要保人出現狀況，而無法繼續繳納保險費時，保險契約效力可以不受影響而繼續有效"],"a":2,"c":"契約條款與法規"},{"id":"113-5","year":"113","n":5,"q":"有關保單條款第一條規定：保險契約的解釋，應探求契約當事人的真意，不得拘泥於所用的文字；如有疑義時，調處中心或是法院裁決應：","o":["以作有利於保險人的解釋為準","以作有利於要保人的解釋為準","以作有利於受益人的解釋為準","以作有利於被保險人的解釋為準"],"a":3,"c":"契約條款與法規"},{"id":"113-6","year":"113","n":6,"q":"被保險人的年齡在購買保險的相關規範，試問下列敘述何者正確？①購買的人壽保險當保險事故發生時，在理賠申請日滿 18 歲的受益人，可獨立辦理申請保險理賠金②目前人壽保險契約規定，以未滿 18 歲之未成年人為被保險人訂立之人壽保險契約，除喪葬費用之給付外，其餘死亡給付之約定於被保險人滿 18 歲時始生效力③某人未婚，購買保險時保險年齡為 18 歲（實際年齡為 17 歲又 10 個月），訂立保險契約時，不須經其法定代理人簽章同意④保險業務員資格之取得，年齡門檻下調為滿 18 足歲的成年人","o":["①②","②③","③④","①④"],"a":3,"c":"契約條款與法規"},{"id":"113-7","year":"113","n":7,"q":"有關保單不喪失價值之敘述何者正確？","o":["人身保險的所有商品皆有本價值","只要是終身型的保險商品皆有本價值","該價值的產生，源自於保單所累積之保單價值準備金","該價值屬於保單受益人的權利"],"a":2,"c":"不喪失價值與保單權益"},{"id":"113-8","year":"113","n":8,"q":"假設兄為要保人，其妹為被保險人，向保險公司投保終身壽險新臺幣（下同）200 萬，並指定兄為受益人，契約生效一年後兄謀殺妹，並經警方調查後破案而起訴。下列敘述何者為正確？①本保險契約係屬為第三人簽定的死亡保險契約②需妹妹親自簽名代表書面同意，契約始生效力③僅需兄與保險業務員約定保險金額即可，妹妹無需知曉④受益人兄仍得受領保險金 200 萬元","o":["①②","①②③④","①③④","②③"],"a":0,"c":"契約條款與法規"},{"id":"113-9","year":"113","n":9,"q":"承上題，下列敘述何者正確？","o":["受益人兄領取保險金新臺幣（下同）200 萬元，免納當年度所得稅","保險金 200 萬元視為被保險人之遺產，須併入妹妹遺產稅計算","保險金 200 萬元視為被保險人之遺產，可免納遺產稅","要保人兄謀害被保險人妹於死，屬保單之除外責任，保險公司無須給付"],"a":3,"c":"契約條款與法規"},{"id":"113-10","year":"113","n":10,"q":"依據「保險業招攬及核保作業控管自律規範」之規定，同一被保險人符合下列何種情形者，應進行財務核保？①累積同一公司壽險保額新臺幣（下同）1,001 萬元以上②累積同一公司傷害險保額 1,001 萬元以上③累積同一公司壽險及傷害保險保額 2,001 萬元以上④累積同業壽險及傷害保險保額 2,501 萬元以上⑤累積其他同業年繳化保費超過其家庭年收入之 30%","o":["①②③④⑤","①②④⑤","②③④","②④"],"a":1,"c":"核保與風險選擇"},{"id":"113-11","year":"113","n":11,"q":"保險業於執行核保或理賠各項服務時，必須取得當事人書面同意蒐集、處理或利用特種個資，請問下列何項資料係屬於特種個資範疇？","o":["病歷、犯罪前科、健康檢查資料","護照號碼、指紋、職業","聯絡方式、財務情況、基因","姓名、出生年月日、國民身分證統一編號"],"a":0,"c":"核保與風險選擇"},{"id":"113-12","year":"113","n":12,"q":"自 2022 年迄今，市場上持續熱銷的壽險保單多屬「投資理財型」商品，下列保單何者不屬於此類型商品？","o":["利率變動型商品","分紅保單","傳統終身壽險","投資型保險"],"a":2,"c":"分紅與利率變動型"},{"id":"113-13","year":"113","n":13,"q":"承上題，該類型壽險商品主要的銷售通路為：","o":["傳統保險經紀人及保險代理人","銀行保險","保險公司業務員","電視行銷"],"a":1,"c":"保險科技與銷售通路"},{"id":"113-14","year":"113","n":14,"q":"一般人身保險採用比例性再保險；請問一年期健康保險採用下列何種比例性再保險方式？","o":["危險保費制","簽單保費制","共同保險制","修正共同保險制"],"a":1,"c":"準備金、費率與再保"},{"id":"113-15","year":"113","n":15,"q":"小額終老保險的商品設計相關規定，下列何者正確？","o":["傳統終身壽險為主契約","一年期傷害保險為主契約","個別被保險人之投保年齡加計繳費期間之數值最高不超過 100","因被保險人免體檢，具逆選擇特性，故僅能跟業務員投保，無法網路投保"],"a":0,"c":"壽險商品、小額終老與微型保險"},{"id":"113-16","year":"113","n":16,"q":"為因應我國邁入高齡化社會，金融監督管理委員會為強化對銀髮族保護，責令保險業針對年齡在 65 歲以上且購買具有保單價值準備金之保險商品等條件之客戶，應於銷售後且同意承保前，須再以電話訪問、視訊或遠距訪問，進行關懷提問，確認客戶瞭解保險商品特性對其之潛在影響及各種不利因素。而符合上述購買「有保單價值準備金」之保險商品係指：①投資型保險②利率變動型保險③外幣終身壽險④終身醫療保險⑤一年期定期保險","o":["③④","①②③","①②","①②⑤"],"a":1,"c":"保險科技與銷售通路"},{"id":"113-17","year":"113","n":17,"q":"有關利率變動型年金之敘述，下列何者錯誤？","o":["保單預定利率即是宣告利率","當宣告利率持續高於市場利率，倘保險公司投資績效又不彰時，保險公司容易面臨利差損風險","目前市場販售的保單，美元利變型保單之宣告利率隨著美國升息而調高","保險公司應於保單條款中敘明宣告利率之決定方式、宣告方式及範圍"],"a":0,"c":"年金保險"},{"id":"113-18","year":"113","n":18,"q":"因應高通貨膨脹時代，在預定利率與宣告利率存在差異性，有關｢利率變動型年金保險」與｢傳統定額年金保險」的差異，下列敘述何者正確？①「利率變動型年金保險」，當宣告利率大於預定利率時，保戶會有額外的增值回饋金，且｢利率變動型年金-甲型」在累積期間以宣告利率累積保單價值，在給付期間以預定利率計算年金金額②｢利率變動型年金-乙型」在累積期間以預定利率累積保單價值，在給付期間以宣告利率計算年金金額③｢傳統定額年金保險」在累積期間以預定利率累積保單價值，在給付期間以預定利率計算年金金額④「傳統定額年金保險」當宣告利率小於預定利率時，保戶能分配的增值回饋金，會被壓縮。且｢傳統定額年金保險」在累積期間以宣告利率累積保單價值，在給付期間透過宣告利率計算年金金額","o":["①③","②④","①④","②③"],"a":0,"c":"年金保險"},{"id":"113-19","year":"113","n":19,"q":"依據投資型人壽保險商品死亡給付對保單帳戶價值之最低比率規範，在目前年齡 32 歲投保投資型人壽保險，投保基本保額為新臺幣（下同）100 萬，其初始保單帳戶價值為 100 萬元，則其死亡給付之保險金額為多少萬元時，始符合死亡給付金額除以保單帳戶價值金額所得出的比值要求？","o":["110","120","140","160"],"a":3,"c":"投資型保險"},{"id":"113-20","year":"113","n":20,"q":"有關變額壽險之敘述，下列何者正確？①設有分離帳戶，由要保人承擔投資風險②係投資帳戶結合終身壽險，且壽險保險費採平準保費③變額係因死亡保險給付隨投資帳戶之現金價值變動④保險公司須承擔保證最低死亡給付","o":["①③④","②③④","②④","③④"],"a":0,"c":"投資型保險"},{"id":"113-21","year":"113","n":21,"q":"變額萬能壽險之特色為何？①要保人須按期繳納約定的保險費②要保人可以彈性繳納保險費③保險給付隨投資帳戶現金價值變動④保險相關費用透明化⑤保險公司至少每個月須通知要保人保單帳戶價值","o":["①③④⑤","②④⑤","①③④","②③④"],"a":3,"c":"投資型保險"},{"id":"113-22","year":"113","n":22,"q":"試問下列何種人身保險商品符合損害填補原則？","o":["日額型住院醫療健康保險","小額終身壽險","旅行平安保險","收據正本理賠實支實付型醫療保險"],"a":3,"c":"契約條款與法規"},{"id":"113-23","year":"113","n":23,"q":"近年類全委投資型保單銷售量遽增，其特色為：①被保險人委託保險公司代為投資操作投資事宜②保險公司委託專業投信公司代為投資操作及管理事宜③保單提供配息的撥回機制④撥回的配息皆屬於投資獲利的回饋⑤類全委保單保戶不需要自負投資盈虧","o":["①③④⑤","②③④","②③","①④⑤"],"a":2,"c":"投資型保險"},{"id":"113-24","year":"113","n":24,"q":"目前市場上銷售之分紅保單若產生盈餘得分配紅利，下列敘述何者正確？①保戶與股東共同分享該盈餘②如果保險公司連續二年以上的分紅，未達保險公司所推估的保單紅利所示範之金額，保險公司僅需通知保戶並取得諒解③保戶可分配之紅利不得超過該盈餘之 70% ④分紅保單的紅利來源，基於該保單所產生之死差益、利差益及費差益⑤保戶保證可以獲得紅利分配","o":["②③⑤","①④","②③④⑤","①④⑤"],"a":1,"c":"分紅與利率變動型"},{"id":"113-25","year":"113","n":25,"q":"被保險人投保意外傷害保險及人壽保險（含死亡給付），在參加自行車競賽時不幸意外身故，試問下列敘述何者正確？","o":["同一意外事故，人壽保險及意外傷害保險均不理賠","同一意外事故，意外傷害保險理賠，人壽保險不須理賠","同一意外事故，意外傷害保險不理賠，人壽保險理賠","同一意外事故，人壽保險及意外傷害保險均須理賠"],"a":2,"c":"傷害與團體保險"},{"id":"113-26","year":"113","n":26,"q":"有關保單之不喪失價值得以轉換的權利為：①減額繳清保險②展期定期保險③給付解約金④保單借款⑤保費自動墊繳⑥豁免保費","o":["①②③④⑤","①②③","①②③④⑤⑥","①③⑤"],"a":0,"c":"不喪失價值與保單權益"},{"id":"113-27","year":"113","n":27,"q":"下列那些保險商品具有「等待期」之設計？①終身壽險②癌症保險③住院醫療保險④失能保險⑤重大傷病保險","o":["②③","②④⑤","②③④⑤","①②③④⑤"],"a":2,"c":"健康醫療保險"},{"id":"113-28","year":"113","n":28,"q":"醫療保險與強制汽車責任保險的保險競合，假設被保險人購買一張收據正本理賠實支實付型醫療保險，遭投保強制汽車責任保險的汽車撞傷，以車禍醫療費用單據申請理賠，試問下列敘述何者正確？","o":["醫療費用單據，申請理賠僅能實支實付型醫療保險或強制汽車責任保險擇一申請","醫療費用單據，申請理賠依據實支實付型醫療保險與強制汽車責任保險兩張保單的保險金額比例責任分攤","醫療費用單據，可申請理賠兩項保險理賠；實支實付型醫療保險以收據正本申請理賠，強制汽車責任保險以收據影本申請理賠","醫療費用單據，可申請理賠兩項保險理賠；實支實付型醫療保險以收據影本申請理賠，強制汽車責任保險以收據正本申請理賠"],"a":2,"c":"健康醫療保險"},{"id":"113-29","year":"113","n":29,"q":"依據住院醫療費用保險單示範條款（實支實付型），被保險人為求謹慎，願意不以全民健康保險之保險對象身分自費住院觀察三日所產生的費用（各項醫療費用金額）均在住院醫療費用保險單示範條款各項保險金條款約定之限額內，請問被保險人至少可以取得實際支付的各項費用多少保險給付金？","o":["被保險人無法取得任何保險給付金","被保險人可以取得全部實際支付之各項費用作為保險給付金","被保險人至少可以取得實際支付之各項費用之 60%保險給付金","被保險人至少可以取得實際支付之各項費用之 65%保險給付金"],"a":3,"c":"健康醫療保險"},{"id":"113-30","year":"113","n":30,"q":"健康醫療保險同時採用自負額與共保條款方式，加強保險公司風險控管，並降低消費者濫用醫療保險資源。假設醫療保險之自負額為新臺幣（下同）2,000 元，並有一定比例的共保條款，若醫療費用為 30,000 元，被保險人總計負擔 4,800 元，保險人給付的金額為 25,200 元，試問共保條款的比例為何？","o":["10%","15%","19%","20%"],"a":0,"c":"健康醫療保險"},{"id":"113-31","year":"113","n":31,"q":"如果醫療費用保險條款上載明「保險期間屆滿時，要保人得交付續保保險費，以逐年使本契約繼續有效，本公司不得拒絕續保」，則該契約屬於：","o":["保證續保","不保證續保","自動續保","有條件續保"],"a":0,"c":"健康醫療保險"},{"id":"113-32","year":"113","n":32,"q":"依據住院醫療費用保險單示範條款（實支實付型）之規定，下列敘述何者錯誤？","o":["產險公司所販售之醫療費用保險不適用保證續保條款","要保人續期保險費於寬限期到期前繳納，壽險公司即須保證續保","壽險公司收取醫療險續保保險費後，倘被保險人前一保單年度保險理賠過高或體況變差，壽險公司可以拒絕續保","壽險公司醫療費用保險之續保保險費不得針對個別被保險人身體狀況調整之"],"a":2,"c":"健康醫療保險"},{"id":"113-33","year":"113","n":33,"q":"有關壽險公司販售的外溢保單之敘述，下列何者錯誤？","o":["被保險人需透過穿戴裝置（IOT）蒐集與身體相關之數據，可以提升自我健康管理","目前市場上銷售的類型以健走型及健檢型保單居多","被保險人達到保單約定的健康計劃，即可保費折減、外溢回饋金或提高保額的功能","保險公司可以透過 IOT 蒐集之數據來完全杜絕被保險人之道德風險"],"a":3,"c":"健康醫療保險"},{"id":"113-34","year":"113","n":34,"q":"壽險業運用科技串聯保險各項業務，提供給保戶更佳、更優化的保險科技服務，壽險公會目前已完成的共享平台有：①電子保單存證②保險存摺③理賠聯盟鏈④保全聯盟鏈⑤保險理賠醫起通","o":["①②③④⑤","②③⑤","①②③","③⑤"],"a":0,"c":"保險科技與銷售通路"},{"id":"113-35","year":"113","n":35,"q":"年金受領人於生存期間可依約定領取年金至死亡為止，一旦年金受領人死亡，年金給付立即停止，即使給付的總金額低於已繳付之總保險費，保險人亦不用退還保費。上述年金保險稱為何種年金保險？","o":["確定給付年金保險","終身年金保險","最低保證年金保險","定期年金保險"],"a":1,"c":"年金保險"},{"id":"113-36","year":"113","n":36,"q":"年金保險失蹤處理方式，下列何者正確？①被保險人在年金保險契約有效期間內，年金開始給付日前失蹤，且法院宣告死亡判決內所確定死亡時日在年金開始給付前者，保險人返還已繳保險費或年金保單價值準備金②被保險人在年金保險契約有效期間內，年金開始給付日前失蹤，且法院宣告死亡判決內所確定死亡時日在年金開始給付前者，保險人無須返還已繳保險費或年金保單價值準備金③被保險人在年金保險契約有效期間內且年金開始給付後失蹤者，除有未支領之保證期間（或保證金額）之年金金額外，保險人依據法院宣告死亡判決內所確定死亡時日為準，不再負給付年金責任④被保險人在年金保險契約有效期間內且年金開始給付後失蹤，如經法院宣告死亡，但於日後發現被保險人生還時，保險人因契約已經消滅，因此不再給付年金","o":["①②","③④","①③","②④"],"a":2,"c":"年金保險"},{"id":"113-37","year":"113","n":37,"q":"人身保險業對保險期間一年以下尚未屆滿之有效契約，應評估未來可能發生之賠款與費用，該評估金額如逾提存之未滿期保費準備金及未來預期之保費收入，應就其差額按險別提存準備金。試問上述準備金屬於何種準備金？","o":["賠款準備金","保費不足準備金","未滿期保費準備金","責任準備金"],"a":1,"c":"準備金、費率與再保"},{"id":"113-38","year":"113","n":38,"q":"保險金信託是將保險理賠交付信託，是結合「保險」與「信託」的金融服務商品，主要目的在促進保險受益人之權利保障。依據現行「保險金信託」相關法律規範，下列敘述何者正確？①保險業得經營保險金信託業務，銀行業不得經營保險金信託業務②人身保險契約中屬死亡或失能之保險金部分，要保人於保險事故發生前得預先洽訂信託契約，其中要保人與被保險人應為同一人，該信託契約之受益人並應為保險契約之受益人，且以被保險人、未成年人、受監護宣告尚未撤銷者為限③保險法對於保險業資金運用，除存款外，以有價證券等八款為資金運用範圍，但保險業辦理保險金信託，其資金運用範圍以現金或銀行存款，公債或金融債券，短期票券，及其他經主管機關核准之資金運用方式四款為資金運用範圍④信託業依信託業法規定擔任保險金信託之受託人，且該信託契約之受益人與保險契約之受益人為同一人，並以被保險人、未成年人、受監護宣告尚未撤銷者為限者，其信託給付屬本金部分，不視為保險給付","o":["①②","②③","③④","①④"],"a":1,"c":"退休、稅務、信託與執業"},{"id":"113-39","year":"113","n":39,"q":"我國現行勞工退休制度所提供的退休金，其制度設計屬於：①採確定給付制②採確定提撥制③退休金專戶所有權屬雇主④退休金專戶所有權屬勞工⑤雇主為本國籍勞工按月提撥勞工退休金，且提存每月薪資 2%~15% ⑥雇主為本國籍勞工按月提繳勞工退休金，且至少提存每月薪資 6%","o":["①③⑤","②④⑥","②③⑥","①④⑤"],"a":1,"c":"退休、稅務、信託與執業"},{"id":"113-40","year":"113","n":40,"q":"有關個人執業的人身保險代理人與人身保險經紀人敘述，下列何者正確？①同時具備保險代理人、保險經紀人資格，僅得選擇一項申領執業證照②具備 5 年以上人壽保險公司核保部門主管經驗且取得核保理賠人員資格，可以視同取得人身保險代理人資格③同時具備人身保險經紀人及財產保險經紀人資格，僅得選擇一項申領財產保險經紀人或人身保險經紀人執業證照④同時具備人身保險代理人及財產保險代理人資格，除經主管機關核准外，僅得選擇一項財產保險代理人或人身保險代理人申領執業證照","o":["①②","②③","③④","①④"],"a":3,"c":"退休、稅務、信託與執業"},{"id":"114-1","year":"114","n":1,"q":"醫療科技進步，投保實支實付型住院醫療費用保險可有效填補被保險人因傷病住院的醫療費用支出，一旦發生保險事故，保險人於接獲事故通知時，應本於最大誠信，依據合理迅速處理之原則，善盡理賠之責任，下列關於理賠處理之敘述何者正確？①受益人申領保險金時，保險公司基於審核保險金之需要，得徵詢其他醫師之醫學專業意見②保險人得經受益人同意調閱被保險人之就醫相關資料。因此所生之費用由保險人負擔③因本契約涉訟者，同意以被保險人住所所在地地方法院為第一審管轄法院④本契約各項保險金之受益人為被保險人本人，保險人不受理其指定及變更⑤被保險人身故時，如本契約保險金尚未給付或未完全給付，則以被保險人之法定繼承人為該部分保險金之受益人","o":["①②⑤","①②④⑤","①②③⑤","①②③④⑤"],"a":1,"c":"健康醫療保險"},{"id":"114-2","year":"114","n":2,"q":"消費者在選擇購買人身保險商品時，應充分考慮自身的風險保障需求以及繳交保險費的長期能力，一旦面臨財務壓力，所購買的保單是否具有不喪失價值，可以彈性應變，顯得格外重要，下列保險商品那些具有保單價值累積功能？①20 年繳費的終身壽險②繳費 6 年期的還本型終身意外保險③1 年期的住院醫療保險④保證續保的 1 年期意外醫療保險⑤躉繳的終身壽險","o":["①⑤","①②⑤","①②④⑤","①②③④⑤"],"a":1,"c":"不喪失價值與保單權益"},{"id":"114-3","year":"114","n":3,"q":"現行可供小朋友投保的保險商品相當多元，在投保人壽保險或傷害保險（包含旅行平安保險）時，為了保障小朋友的生命安全，保險法第 107 條及第 135 條規定，人壽保險及傷害保險被保險人滿 15 歲前身故時，保險公司只能在限額內提供喪葬費用保險金，根據遺產及贈與稅法規範計算，目前該限額是指新臺幣多少金額？","o":["61.5 萬元","63.5 萬元","65 萬元","69 萬元"],"a":3,"c":"契約條款與法規"},{"id":"114-4","year":"114","n":4,"q":"保險業的準備金提存制度，有助於確保其財務清償能力之穩健性，進而保障消費者之投保權益；投資型保險的經營技術複雜，政府需要更多技術上之監督與管理，依據人身保險業經營投資型保險業務應提存之各種準備金規範，投資型壽險應提存下列那些準備金？①責任準備金②未滿期保費準備金③賠款準備金④保費不足準備金⑤保證給付責任準備金","o":["①②③④","①②③⑤","①②④⑤","①②③④⑤"],"a":3,"c":"準備金、費率與再保"},{"id":"114-5","year":"114","n":5,"q":"生命充滿無限可能與挑戰，人從出生至死亡，充滿了機會也充滿了風險，因此人壽保險公司設計了許多長年期以及終身型的人身保險商品，消費者可依需求選取購買；長年期繳費之保險商品，透過長期繳費方式累積保單價值，成為保戶潛在之隱形資產。依據保險法之規定，下列敘述何者正確：①要保人終止保險契約，保險繳費至少滿 2 年以上者，保險人於接到通知後 1 個月內償付解約金②保險人支付解約金的金額不得少於要保人應得保單價值準備金之四分之三③償付解約金之條件及金額，應載明於要保書④保險費付足 1 年以上者，要保人得以保險契約為質，向保險人借款","o":["②","②④","①②④","②③④"],"a":1,"c":"不喪失價值與保單權益"},{"id":"114-6","year":"114","n":6,"q":"下列何者屬於「保險業得辦理網路投保之人身保險商品」？①傷害保險及其附加之實支實付型傷害醫療保險②利率變動型年金保險③利率變動型終身壽險④日額型住院醫療健康保險","o":["①②","①③","①②④","②③④"],"a":2,"c":"保險科技與銷售通路"},{"id":"114-7","year":"114","n":7,"q":"投資具有風險性，投資型保險契約所提供連結之投資標的及專設帳簿資產之運用，除要保人以保險契約約定委任保險人全權決定運用標的者外，以下列那些投資標的為限：①銀行存款②公債、國庫券③臺灣存託憑證④外國證券集中交易市場、店頭市場交易之股票、公司債⑤外國商用不動產⑥境外基金","o":["①②③④","①②④⑥","①②③④⑥","①②③④⑤⑥"],"a":2,"c":"投資型保險"},{"id":"114-8","year":"114","n":8,"q":"投保以外幣收付之非投資型人身保險契約時，保戶必須遵守相關注意事項，下列敍述何者正確？","o":["保險人與要保人得約定保險費、保險給付、費用及其他款項收付之外幣幣別時，得約定新臺幣與外幣或各幣別間之相互變換的條件","保險契約種類以人壽保險、年金保險及健康保險為限，並須經中央銀行許可","健康保險之給付項目，以住院醫療保險為限","以外幣收付之非投資型人身保險契約與新臺幣收付之人身保險契約間，得依約定條件辦理契約轉換"],"a":1,"c":"壽險商品、小額終老與微型保險"},{"id":"114-9","year":"114","n":9,"q":"人壽保險的財務核保目的在於排除不當的保障設計、有效防止道德危險的發生及避免過多停效保單，下列何者非屬財務核保考量之項目：","o":["居住地區","職業穩定性","收入來源","有效保額"],"a":0,"c":"核保與風險選擇"},{"id":"114-10","year":"114","n":10,"q":"人壽保險公司推出利率變動型保險商品，以應對市場利率之波動性，依據人身保險商品審查應注意事項，利率變動型人壽保險商品之保單經過年度必須屆滿幾年？其依利率變動調整值計算而得之金額始得採現金給付或儲存生息方式辦理，且不得低於年給付方式。","o":["3 年","5 年","6 年","7 年"],"a":2,"c":"分紅與利率變動型"},{"id":"114-11","year":"114","n":11,"q":"投資型保險商品涉及投資風險，因此保險人應該充分揭露相關資訊，根據投資型保險資訊揭露應遵循事項之規定，就相關「銷售文件」應經保險公司審查通過並建檔備查。前述所稱銷售文件係指：①保險商品說明書②保險商品簡介③建議書④投資標的配置表","o":["①②③","①③④","②③④","①②③④"],"a":0,"c":"投資型保險"},{"id":"114-12","year":"114","n":12,"q":"依照現行投資型保險商品銷售自律規範，人壽保險公司應依投資型保險資訊揭露應遵循事項規定，於保險契約約定時間，主動以要保人選擇之方式將保單帳戶價值等相關重要事項通知送達要保人，其內容應包括要保人最近一次風險屬性評估問卷填答之可承受價格損失比率（含匯率風險），每季應至少 1 次。各壽險公司並應於網站揭露結構型商品連結標的之淨值或價格。但如該投資型保險商品連結含有非百分之百保本之結構型商品時，除現行每季寄對帳單外，當該結構型商品虧損達到多少百分比時，亦應以書面或電子郵件通知。","o":["15%","20%","25%","30%"],"a":3,"c":"投資型保險"},{"id":"114-13","year":"114","n":13,"q":"分紅保單提供要保人參與保險公司盈餘分配的機會，下列有關保單分紅的敘述何者正確？①美式分紅可以採用現金給付紅利②英式分紅可以將紅利抵繳保險費③美式分紅可以將紅利儲存升息④英式分紅可以將紅利滾入保險金額來增加保險金額","o":["①③","①②③","①③④","①②③④"],"a":2,"c":"分紅與利率變動型"},{"id":"114-14","year":"114","n":14,"q":"住院醫療限額的計算與是否為同一疾病或傷害的治療有關，根據住院醫療費用保險單示範條款（實支實付型）被保險人於本契約有效期間，因同一疾病或傷害，或因此引起之併發症，於出院後幾日之內於同一醫院再次住院時，其各種保險金給付合計額，視為 1 次住院辦理？","o":["14 日","15 日","21 日","30 日"],"a":0,"c":"健康醫療保險"},{"id":"114-15","year":"114","n":15,"q":"被保險人的投保年齡與疾病發生率有關，被保險人於投保住院醫療保險時，應注意其保險年齡之計算，下列敘述何者錯誤？","o":["被保險人的投保年齡，以足歲計算，但是未滿 1 歲的零數超過 6 個月者加算 1 歲","真實投保年齡較保險費率表所載最高年齡為大者，保險契約無效，其已繳保險費無息退還要保人","被保險人因投保年齡的錯誤，而致短繳保險費者，要保人得補繳短繳的保險費並加計利息","被保險人因投保年齡的錯誤，而致短繳保險費者，要保人得按照所付的保險費與被保險人的真實年齡比例減少保險金額。"],"a":2,"c":"健康醫療保險"},{"id":"114-16","year":"114","n":16,"q":"實支實付型住院醫療保險，於限額內給付被保險人在保險契約有效期間內因約定之疾病或傷害住院診療時所產生的醫療費用，依據住院醫療費用保險單示範條款（實支實付型），因下列那些情形住院，所發生之住院醫療費用不在承保範圍之內？①人工受孕②因被強制性交、誘姦或與依法不得結婚者相姦而受孕者之流產行為③健康檢查④被保險人之犯罪行為引起之傷害⑤因本人或其配偶患有礙優生之遺傳性、傳染性疾病或精神疾病之流產行為⑥戒毒","o":["①②③④","①③④⑥","①②③④⑥","①③④⑤⑥"],"a":1,"c":"健康醫療保險"},{"id":"114-17","year":"114","n":17,"q":"王小美與姊姊王恩慈及弟弟王仁義手足之情甚篤，王小美於民國 80 年 1 月 1 日與張大同結婚，83 年生下兒子張德旺，86 年生下女兒張德馨，之後王小美於民國 88 年 8 月 8 日購買人壽保險保額 120 萬元，並指定身故保險金受益人如下，第一順位：配偶張大同（60%）、兒子張德旺（20%）、女兒張德馨（20%）；第二順位：姊姊王恩慈（50%）、弟弟王仁義（50%）。王小美之先生張大同於民國 112 年 1 月因癌症去世，王小美並未更改保單之受益人，後王小美不幸於 113 年 6 月 10 日因車禍去世，保險公司應如何給付身故保險金 120 萬元？","o":["兒子張德旺 24 萬元，女兒張德馨 24 萬元，其餘 72 萬元為王小美之遺產","兒子張德旺 24 萬元，女兒張德馨 24 萬元，姊姊王恩慈 36 萬元，弟弟王仁義 36 萬元","兒子張德旺 60 萬元，女兒張德馨 60 萬元，姊姊王恩慈 0 元，弟弟王仁義 0 元","兒子張德旺 30 萬元，女兒張德馨 30 萬元，姊姊王恩慈 30 萬元，弟弟王仁義 30 萬元"],"a":2,"c":"契約條款與法規"},{"id":"114-18","year":"114","n":18,"q":"為滿足高齡者之基本保險保障需求，依現行小額終老保險商品相關規範目前核保作業應注意下列那些重點？①同業間保險金給付上限為新臺幣 90 萬元②同業間保險金給付上限為新臺幣 70 萬元③個別被保險人之「小額終老保險」商品組合有效契約以 4 件為限④個別被保險人之「小額終老保險」商品組合有效契約以 3 件為限","o":["①④","②③","①③","②④"],"a":2,"c":"壽險商品、小額終老與微型保險"},{"id":"114-19","year":"114","n":19,"q":"當保險契約有效時，保戶同時向二家以上保險公司提出契約變更或理賠申請者，可向其中一家提出申請，並同意「保險科技運用共享平台」推播通知給其他保險公司一併申請。有關保險科技運用共享平台及其應用，下列敘述何者錯誤？","o":["「保全聯盟鏈」服務之案件申請人以具完全行為能力之要保人本人為限","「理賠聯盟鏈」服務之案件申請人以具完全行為能力之被保險人本人為限","「保全聯盟鏈」及「理賠聯盟鏈」服務之案件皆排除旅行平安保險、團體保險及待記名式保單","保險科技運用共享平台由財團法人保險事業發展中心所建置"],"a":3,"c":"保險科技與銷售通路"},{"id":"114-20","year":"114","n":20,"q":"人身保險之核保風險控管必須確認業務員是否親晤要保人、被保險人及確認要保人、被保險人是否親簽相關文件。惟下列那些險種或業務得不適用前開親晤之規定？①以集體投保或團體保險方式辦理之微型保險，並取得要保單位或代理投保單位出具聲明書或評估表，確認被保險人之投保資格或告知其所服務對象或提供該單位所留存之投保意旨或內部訪視紀錄②由要保單位付費之團體保險③由團體成員自行全額負擔保費之團體保險，且要保單位出具加蓋大小章之聲明書，以證明被保險人為其所屬成員及其投保意願④個別被保險人國外旅遊之保險金額不高於新臺幣 1,500 萬元（含）及國內旅遊之保險金額不高於 1,000 萬元（含）之集體彙繳件旅行平安保險及由團體成員自行全額負擔保費之團體旅行平安保險件","o":["①②","②③④","①②③","①②③④"],"a":2,"c":"核保與風險選擇"},{"id":"114-21","year":"114","n":21,"q":"人壽保險單為長期繼續性保險契約，要保人應該按時繳交保險費，以維護保險契約之效力，避免發生未繳保費，導致保單停效。下列有關人壽保險契約發生停效的敘述，何者正確？①契約停止效力後，要保人得在停效日起 2 年內，申請復效。但保險期間屆滿後不得申請復效②要保人於停止效力之日起 6 個月內提出復效申請，並經要保人清償保險費扣除停效期間的危險保險費後之餘額，自翌日中午 12 時起，開始恢復其效力③要保人於停止效力之日起 6 個月後提出復效申請時，保險公司得要求要保人提供被保險人之可保證明④被保險人之危險程度有重大變更已達拒絕承保程度者，保險公司得拒絕其復效","o":["①④","①②④","①③④","①②③④"],"a":2,"c":"契約條款與法規"},{"id":"114-22","year":"114","n":22,"q":"甲君為 45 歲男性，為了增加家庭責任保障，考慮購買乙人壽保險公司推出繳費年期同保障年期的 20 年定期壽險商品 X 與 Y，其中 X 保單採自然保費設計，Y 保單採平準保費設計，下列敘述何者正確？","o":["第一年保險費率 X 保單高於 Y 保單，第 20 年保險費率 X 保單高於 Y 保單","第一年保險費率 Y 保單高於 X 保單，第 20 年保險費率 Y 保單高於 X 保單","第一年保險費率 X 保單高於 Y 保單，第 20 年保險費率 Y 保單高於 X 保單","第一年保險費率 Y 保單高於 X 保單，第 20 年保險費率 X 保單高於 Y 保單"],"a":3,"c":"準備金、費率與再保"},{"id":"114-23","year":"114","n":23,"q":"醫療險契約中有等待期間之規範，等待期間是保單生效日至保險責任生效日之間的一段期間，有關等待期間之規範，下列何者錯誤？","o":["重大疾病及癌症保險於投保時之等待期間最長得為 90 日","除癌症保險及重大疾病保險外之健康保險，其等待期間最長以 30 日為限","重大疾病及癌症保險保單在保單復效時，仍須服從等待期間的限制","重大疾病及特定傷病保險，若其事故發生原因非由疾病所致，則不受等待期間的限制"],"a":2,"c":"健康醫療保險"},{"id":"114-24","year":"114","n":24,"q":"團體傷害保險的特性，下列何者正確？","o":["團體保險被保險成員的保險金額，可依團體成員的個人意願自由選擇","團體成立的動機得以投保為目的所組成，團體成員人數至少 10 人（含）以上","保險人承保後，保險公司僅簽發一張保單給投保團體，其團體被保險成員僅持有保險證","雇主員工團體的團體保險費若由雇主全額負擔者，至少必須 75%以上的合格員工參加投保"],"a":2,"c":"傷害與團體保險"},{"id":"114-25","year":"114","n":25,"q":"終身壽險含有祝壽保險金給付者，其祝壽保險金的給付年度不得在被保險人幾歲以前？","o":["80 歲","85 歲","90 歲","95 歲"],"a":3,"c":"壽險商品、小額終老與微型保險"},{"id":"114-26","year":"114","n":26,"q":"保戶透過超商多媒體服務機（KIOSK）申請線上理賠，必須符合的要件，下列何者錯誤？","o":["限匯款至受益人（同被保險人）本人帳戶者","適用險種以住院醫療費用保險（日額型、實支實付型）及傷害醫療保險（日額型、實支實付型）為限","當次理賠總額小於新臺幣 20 萬元者","可受理的理賠案件僅限住院、不需正本收據且事故原因無須進行理賠調查者"],"a":2,"c":"保險科技與銷售通路"},{"id":"114-27","year":"114","n":27,"q":"現代人重視養生，加上醫療科技進步，高齡長壽成為社會普遍現象，消費者可以利用年金保險來應對長壽風險，下列有關年金保險的敘述何者正確？①年金保險契約訂立後，保險人就開始給付年金，屬於即期年金②年金保險契約訂立後，約定經過一定年數，或被保險人達到一定年齡後，保險人才開始給付年金者屬於遞延年金③年金累積期間，壽險公司依據要保人交付之保險費，減去附加費用後，依預定利率計算年金保單價值準備金屬於利率變動型年金④年金累積期間，壽險公司依據要保人交付之保險費，減去附加費用後，依分離帳戶投資績效計算保單價值準備金屬於投資型年金","o":["①②","①②④","①②③","①②③④"],"a":1,"c":"年金保險"},{"id":"114-28","year":"114","n":28,"q":"有關 109 年 6 月 30 日以後生效之人壽保險商品，其死亡給付對保單價值準備金（保單帳戶價值）之最低比率規範，下列敘述何者正確？①小額終老保險不適用本規範②非投資型人壽保險的最低比率＝死亡給付除以保單價值準備金之值③被保險人之到達年齡在 41 歲以上、50 歲以下；其比率不得低於 140% ④被保險人之到達年齡在 91 歲以上；其比率不得低於 100%","o":["①②③","①②④","②③④","①②③④"],"a":3,"c":"投資型保險"},{"id":"114-29","year":"114","n":29,"q":"比較變額壽險與變額萬能壽險的特性，下列何者錯誤？","o":["變額壽險採定期定額方式繳納保險費；變額萬能壽險在不影響保險契約效力的情況下，可隨時繳納任意金額的保險費","變額壽險以分離帳戶儲存保單帳戶價值，變額萬能壽險則儲存在一般帳戶中","變額萬能壽險的保戶若未繳保費，而當期保單價值準備金足以支付保險成本及保單費用者，保單繼續有效","變額壽險與變額萬能壽險的保險金額皆隨投資績效而變動"],"a":1,"c":"投資型保險"},{"id":"114-30","year":"114","n":30,"q":"113 年 10 月 1 日起生效之實支實付險新制度，係指同一次醫療行為時，就數個同性質保險商品皆可申請理賠之處理原則，下列敘述何者錯誤？","o":["同一次醫療行為，就數個同性質保險商品所獲得理賠金額合計，不得超過實際負擔的醫療費用","只能以醫療費用收據正本申請理賠","限制此類商品投保數量，1 人最多只能投保 3 張實支實付型保險商品","若投保多張保險商品，則第 1 張保單會在保單實支限額內給付，第 2 張保單僅就第 1 張保單理賠不足的差額進行賠付，以此類推"],"a":2,"c":"健康醫療保險"},{"id":"114-31","year":"114","n":31,"q":"核保標準中，被保險人至少滿足何項要件，始得適用優體費率出單承保？","o":["須年滿 15 歲以上，符合標準體體位，且被保險人通過優體體位判定之必要核保程序","須年滿 18 歲以上，符合標準體體位，且被保險人通過優體體位判定之必要核保程序","須年滿 15 歲以上，符合次標準體體位，且被保險人通過優體體位判定之必要核保程序","須年滿 18 歲以上，符合次標準體體位，且被保險人通過優體體位判定之必要核保程序"],"a":1,"c":"核保與風險選擇"},{"id":"114-32","year":"114","n":32,"q":"有關投資型年金保險應提存的責任準備金，下列敘述何者錯誤？","o":["年金累積期間內，提存責任準備金及保證給付責任準備金","年金給付期間計提準備金，應依年金給付開始日之利率變動型年金保險費率相關規範辦理","如提供「加值給付」或其他具類似特性之給付者，應基於收支平衡之原則估計成本","投資型保單所提供之「加值給付」，其責任準備金應提列於專設帳簿下"],"a":3,"c":"準備金、費率與再保"},{"id":"114-33","year":"114","n":33,"q":"某甲為自己投保終身壽險分紅保單，保險費為年繳，且附加 2~6 級失能豁免保險費附約，承保主約及附約保險費，某甲發生意外傷害事故達第 4 級失能而豁免保險費，下列敘述何者錯誤？","o":["豁免保險費期間，某甲不得要求調整繳費期間長短或變更繳費頻率","豁免保險費期間，若有保單分紅，某甲因為已經豁免保險費，故無權分配該期間的保單紅利","豁免保險費期間，依照保單約定的條件繼續累積保單價值準備金","豁免保險費期間，保險保障仍持續有效"],"a":1,"c":"契約條款與法規"},{"id":"114-34","year":"114","n":34,"q":"有關年金保險，下列敘述何者錯誤？","o":["連生年金（Joint Life Annuity）係指年金受領人有 2 人以上者，當其中任 1 人身故後，保險人不再給付年金，保險契約終止","年金保險在給付期間內，保戶得辦理解約或部分解約","遞延年金保險期間分為累積期間與給付期間","保證期間終身年金係指在保證給付期間內，不論年金受領人是否生存，保險人給付保險金，但保證期間屆滿後，以年金受領人生存為年金給付的要件"],"a":1,"c":"年金保險"},{"id":"114-35","year":"114","n":35,"q":"要保人指定受益人，且聲明放棄處分權者，該受益人為不可撤銷受益人。有關該受益人之權益，下列敘述何者正確？①要保人若要變更受益人時，需取得不可撤銷受益人同意，才能變更②在被保險人生存期間，若受益人身故，其受益權得由受益人之繼承人繼受之③要保人若處分保單價值時，必須先取得不可撤銷受益人同意，否則不得處分保單價值","o":["①②","①③","②③","①②③"],"a":1,"c":"契約條款與法規"},{"id":"114-36","year":"114","n":36,"q":"有關人身保險的被保險人失蹤且經法院宣告死亡者，下列敘述何者錯誤？","o":["人壽保險被保險人經法院宣告死亡且在保單有效期間內，即視同死亡並給付保險金","個人即期生存年金保險的被保險人失蹤時，除了未支領的保證期間（或保證金額）之年金金額外，以法院宣告死亡判決所確定的死亡日為準，不再負給付年金之責","被保險人失蹤期間，若有應繳保險費，可以申請暫停繳納保費，直到法院死亡判決日再申請保險理賠","個人遞延年金保險的被保險人，在年金開始給付前失蹤，依法院判決所確定的死亡日在年金開始給付前，返還已繳保險費或年金保單價值準備金"],"a":2,"c":"年金保險"},{"id":"114-37","year":"114","n":37,"q":"保險人採取健康促進的機制來設計外溢保單，鼓勵被保險人自發的增進自己健康，並提供健康管理回饋。下列何者為可行的健康管理回饋機制？①降低保險費或提供現金給付②提高全部或部分保險給付項目之保險金額③被保險人投保同類型保險時，提供新契約保費折扣","o":["①②","①③","②③","①②③"],"a":0,"c":"健康醫療保險"},{"id":"114-38","year":"114","n":38,"q":"有關微型保險的特色及商品，下列何者錯誤？","o":["商品內容包含小額的生存給付或滿期給付之設計","以經濟弱勢者為承保對象","保險金額低，保費低廉","保障期間較短、保障內容簡單"],"a":0,"c":"壽險商品、小額終老與微型保險"},{"id":"114-39","year":"114","n":39,"q":"有關保險與稅務的問題，下列敘述何者正確？①申報個人綜合所得稅之列舉扣除額時，係針對身體病痛接受治療而支付之醫療費用，減除各險種之保險給付後，未獲理賠之醫藥費可列報為「醫藥及生育費」扣除額②無須計入個人基本所得額的保險給付，包括：健康保險給付、傷害保險給付及受益人與要保人為同一人之人壽保險與年金保險給付③保險期間始日在 95 年 1 月 1 日以前之保險契約，且要保人與受益人非屬同一人之人壽保險及年金保險給付，無須計入基本所得額","o":["①②","①③","②③","①②③"],"a":3,"c":"退休、稅務、信託與執業"},{"id":"114-40","year":"114","n":40,"q":"要保人繳足保險費累積達有保單價值準備金時，應繳保險費未能按期繳付者，保單有不喪失價值選擇權。當要保人選擇辦理展期定期保險，對保障及保單的影響，下列何者錯誤？","o":["保險範圍與原契約同","原保險期間不變","原保險金額不變","保單繼續有效，此後保險費不必再繼續繳納"],"a":1,"c":"不喪失價值與保單權益"},{"id":"115-1","year":"115","n":1,"q":"人壽保險分期繳納的第二期以後保險費到期未交付時，保險公司並不會對所有繳費方式進行催告。根據人壽保險單示範條款規定，下列那些情況保險公司不會進行催告？①月繳②季繳③半年繳④年繳","o":["①②","①③","②③","③④"],"a":0,"c":"契約條款與法規"},{"id":"115-2","year":"115","n":2,"q":"目前我國傷害保險費率是依下列那項因素做為承保的分類基礎？","o":["年齡","性別","職業類別","居住地區"],"a":2,"c":"傷害與團體保險"},{"id":"115-3","year":"115","n":3,"q":"根據人壽保險單示範條款，關於要保人的契約撤銷權，下列敘述何者正確？","o":["契約撤銷生效前，若發生保險事故，保險公司仍應依契約規定負保險責任","契約撤銷生效後，保險公司應依要保人所繳保險費加計利息，退還要保人","契約簽訂後，若保險單於 6 月 1 日早上送達要保人，則要保人最遲應於 6 月 7 日凌晨零時前撤銷契約","若保險公司於 6 月 5 日中午 12 時前收到要保人撤銷契約的書面通知，則契約撤銷的效力自 6 月 5 日中午 12 時起生效"],"a":0,"c":"契約條款與法規"},{"id":"115-4","year":"115","n":4,"q":"利率變動型年金保險之被保險人若於年金給付開始日前身故，根據利率變動型年金保險單示範條款的規定，保險公司應如何處理？","o":["無息退還保險費","返還保單價值準備金","給付年金金額予受益人","給付仍未支領之年金餘額予身故受益人或其他應得之人"],"a":1,"c":"年金保險"},{"id":"115-5","year":"115","n":5,"q":"為預防保戶在領取高額醫療給付後，再於瀕臨身故前辦理解約申請解約金，長期健康保險在計算保費時，主要會考慮下列那項因素？","o":["預定利率","宣告利率","保單脫退率","保單繼續率"],"a":2,"c":"準備金、費率與再保"},{"id":"115-6","year":"115","n":6,"q":"投資型保險會收取多項費用，根據投資型人壽保險單示範條款，下列關於投資型保險相關費用的敘述，何者正確？","o":["保單管理費是指提供被保險人身故、完全失能保障所需的成本","目標保險費是指為增加保單帳戶價值，在超額保險費以外所繳付之保險費","超額保險費是契約所載明之定期繳付保險費，用以提供被保險人身故、完全失能保障及投資需求","保費費用是指因契約簽訂及運作所產生並自保險費中扣除之相關費用，包含核保、銷售、服務及其他必要費用"],"a":3,"c":"投資型保險"},{"id":"115-7","year":"115","n":7,"q":"年金保險的被保險人有兩人或兩人以上，年金繼續給付至其中最後生存者死亡為止，是指下列何種年金？","o":["單生年金","連生年金","分期退還年金","連生及遺族年金"],"a":3,"c":"年金保險"},{"id":"115-8","year":"115","n":8,"q":"人壽保險的投保金額可採用人類生命價值法或家庭需求法評估，關於這兩種方法，下列敘述何者錯誤？","o":["人類生命價值法在計算個人收入時，應以未扣除費用前之總收入為準","家庭需求法由於將配偶與子女的需求納入考量，因此較能正確推估維持保障之資金需求","人類生命價值法在計算上是以個人預期未來每年收入之折現值減去未來每年維持生活費用之折現值","家庭需求法在計算維持目前生活水準所需資金時，須扣除目前已有之商業保險、社會保險的保障"],"a":0,"c":"壽險商品、小額終老與微型保險"},{"id":"115-9","year":"115","n":9,"q":"近年投資型年金保險已成為民眾規劃退休生活的重要工具，而投資型年金保險最典型者即為變額年金，下列關於變額年金特性的敘述，何者正確？","o":["保險公司會保證年金給付的金額","變額年金的投資風險由保險公司承擔","變額年金的保單帳戶價值不會隨投資狀況變動","開始領取年金後，保單持有人每期領取的年金單位數是固定的"],"a":3,"c":"年金保險"},{"id":"115-10","year":"115","n":10,"q":"全權委託投資型保險契約於簽訂後，若因法令變更致其投資或交易範圍有增減時，根據投資型保險投資管理辦法規定，保險人應於不低於幾日之期間內通知要保人？","o":["30","60","90","120"],"a":1,"c":"投資型保險"},{"id":"115-11","year":"115","n":11,"q":"從廣義來說，人身保險的核保可按照契約成立的時間先後，分為契約成立前、成立時與成立後三個階段，因此除核保人員外，尚有其他人員實質上亦擔當危險選擇的工作。下列實質上亦從事危險選擇的人員，就上述三個階段進行危險選擇的順序，何者為正確？①核保人員②理賠調查人員③業務員④體檢醫師","o":["①②③④","③①②④","③②④①","③④①②"],"a":3,"c":"核保與風險選擇"},{"id":"115-12","year":"115","n":12,"q":"張三於 2022 年 7 月 1 日以自己為要保人，其妻李四為被保險人，向保險公司投保終身壽險，並約定其子小明為受益人。根據人壽保險單示範條款的規範，下列各種情況，那些敘述是正確的？①張三故意致李四於死，保險公司不負給付保險金之責②李四於 2023 年 11 月 15 日自殺身亡，保險公司不負給付保險金之責③張三因結夥搶劫，在警方圍捕時因拒捕不幸遭警方擊斃，此為保險公司之除外責任④小明為領取保險金，故意致李四於死，則小明會喪失受益權，保險公司給付之保險金會作為李四之遺產","o":["①②","①③","①②④","①③④"],"a":2,"c":"契約條款與法規"},{"id":"115-13","year":"115","n":13,"q":"人壽保險商品有多種型態，請問一般俗稱的「養老保險」是指下列何種商品？","o":["定期壽險","終身壽險","健康保險","生死合險"],"a":3,"c":"壽險商品、小額終老與微型保險"},{"id":"115-14","year":"115","n":14,"q":"實支實付型醫療險是因應日益龐大的自費醫療支出最基本必備的保險，根據現行住院醫療費用保險單示範條款（實支實付型）的規定，下列敘述何者錯誤？","o":["被保險人為重建其基本功能所作之外科整型手術，保險公司不負給付責任","對於每日病房費用、住院醫療費用、手術費用等已獲得全民健康保險給付的部分，保險公司不負給付責任","被保險人於契約有效期間，因同一疾病或傷害，於出院後 14 日內於同一醫院再次住院時，視為一次住院辦理","被保險人不以全民健康保險之保險對象身分住院診療，因而未獲得全民健保給付者，保險公司對於各項醫療費用之給付，不得低於被保險人實際支付之各項費用的 65%"],"a":0,"c":"健康醫療保險"},{"id":"115-15","year":"115","n":15,"q":"關於人壽保險與年金保險的差異，下列敘述何者錯誤？","o":["人壽保險一般需要可保性證明，年金保險則不需要","人壽保險保險費的計算基礎為死亡率，年金保險則是依據生存率","人壽保險的投保動機為保障遺屬，年金保險為保障自己的老年生活","人壽保險是保障自身太晚死亡所致家庭經濟損失的風險，年金保險則是保障自身生存時間太短所致收入不足的風險"],"a":3,"c":"年金保險"},{"id":"115-16","year":"115","n":16,"q":"變額年金保險進入給付期後，年金金額的決定包括下列三個步驟，請問其順序為何？①轉換為年金單位數②決定後續的每月年金金額③決定年金給付開始日的年金金額","o":["①②③","②①③","②③①","③①②"],"a":3,"c":"年金保險"},{"id":"115-17","year":"115","n":17,"q":"在人身保險的核保中，體檢醫師對被保險人實施的健康檢查，是基於保險醫學的應用，而與臨床醫學不同。就保險醫學與臨床醫學所著重之重點差異，下列敘述何者錯誤？","o":["保險醫學的目的著重在損失率的影響；臨床醫學則強調病症治癒","保險醫學的對象是針對所有被保險人的評估；臨床醫學則僅針對病患本人","就期間長短而言，保險醫學的觀察期較短；臨床醫學則因罹病期的緣故，觀察期較長","保險醫學的理論基礎基於危險的不確定性；臨床醫學則依病況而有一定的可知性"],"a":2,"c":"核保與風險選擇"},{"id":"115-18","year":"115","n":18,"q":"被保險人投保年齡發生錯誤時，根據人壽保險單示範條款的規定，下列敘述何者正確？","o":["因投保年齡錯誤致溢繳保險費，保險公司應加計利息退還溢繳部分之保險費","真實投保年齡較保險公司保險費率表所載最高年齡為大者，保險契約無效，其已繳保險費加計利息退還要保人","因投保年齡錯誤致短繳保險費，在發生保險事故後始發覺且其錯誤不可歸責於保險公司者，要保人得要求補繳短繳之保險費","因投保年齡錯誤致溢繳保險費，在發生保險事故後才發現且錯誤發生在保險公司者，則保險公司按原繳保險費與應繳保險費之比例提高保險金額，不退還溢繳之保費"],"a":3,"c":"契約條款與法規"},{"id":"115-19","year":"115","n":19,"q":"依據現行傷害保險單示範條款的規範，下列關於傷害保險實務運作的敘述，那些是正確的？①意外傷害事故，指非由疾病引起之外來突發事故②被保險人從事汽車、機車及自由車等的競賽或表演所致死亡、失能或傷害，為契約之絕對不保事項③以未滿十五足歲之未成年人為被保險人，除喪葬費用外，其餘死亡給付於被保險人滿十五足歲之日起才發生效力④被保險人於契約有效期間內遭受意外傷害事故，自意外傷害事故發生之日起一百八十日以內死亡者，保險公司負給付責任","o":["①②","①②③","①③④","①②③④"],"a":2,"c":"傷害與團體保險"},{"id":"115-20","year":"115","n":20,"q":"依現行利率變動型年金保險單示範條款之規定，在年金給付開始時，保險公司是依下列何種利率計算年金金額？","o":["預定利率","宣告利率","定存利率","責任準備金利率"],"a":0,"c":"年金保險"},{"id":"115-21","year":"115","n":21,"q":"近兩年由於股市熱絡，投資型保險的受歡迎度逐漸不亞於傳統人身保險，下列關於投資型保險與傳統型保險的敘述，何者錯誤？","o":["萬能保險屬於投資型保險商品","投資型保險在保費的透明度上，比傳統型保險高","投資型保險的保單現金價值並不固定，傳統型保險則是固定的","傳統型保險的資金放置於保險公司的一般帳戶，投資型保險則置於分離帳戶"],"a":0,"c":"投資型保險"},{"id":"115-22","year":"115","n":22,"q":"人身保險中的某些險種會有試保期間或免責期間的設計，下列各類保險中，那些保險通常會有此種設計？①定期壽險②醫療費用保險③失能保險④傷害保險⑤癌症保險⑥長期照顧保險","o":["①②④⑤","②③⑤⑥","②④⑤⑥","②③④⑤⑥"],"a":1,"c":"健康醫療保險"},{"id":"115-23","year":"115","n":23,"q":"影響人壽保險費率釐訂的主要因素為預定死亡率、預定利率與預定費用率，其中何者為計算純保費的因素？","o":["預定死亡率、預定費用率","預定利率、預定費用率","預定死亡率、預定利率","預定死亡率、預定利率、預定費用率"],"a":2,"c":"準備金、費率與再保"},{"id":"115-24","year":"115","n":24,"q":"依現行傷害保險單示範條款的規定，對於被保險人職業變更的處理，下列敘述何者錯誤？","o":["被保險人職業變更後的危險性減低，保險人接到通知後，應自職業變更之日起，按差額比率退還未滿期保險費","被保險人職業變更後的危險性增加，保險人接到通知後，應自職業變更之日起，按差額比率增收未滿期保險費","被保險人職業變更後的危險性增加，未依約定通知保險人而發生保險事故者，保險人得終止契約，且保險費不予退還","被保險人職業變更後的危險性增加，已落於拒保範圍內者，保險人接到通知後得終止契約，並按日計算退還未滿期保險費"],"a":2,"c":"傷害與團體保險"},{"id":"115-25","year":"115","n":25,"q":"關於微型保險的特色，下列敘述何者正確？","o":["以傳統型終身壽險為主契約","商品之設計含有生存或滿期給付","主要是為因應高齡化，減輕青壯人口對社會經濟支持之負擔而設計的商品","商品種類以 1 年期之傳統型定期壽險、傷害保險與實支實付型傷害醫療險為限"],"a":3,"c":"壽險商品、小額終老與微型保險"},{"id":"115-26","year":"115","n":26,"q":"投資型保險的投資標的若因流動性不佳，中途贖回時可能產生折價損失的風險，此一風險係指下列何者？","o":["利率風險","匯兌風險","解約風險","信用風險"],"a":2,"c":"投資型保險"},{"id":"115-27","year":"115","n":27,"q":"人壽保險保險費依是否按危險而累進可分為自然保費與平準保費，關於兩者的差別，下列敘述何者錯誤？","o":["自然保費之費率隨保險期間之經過而遞增","平準保費之優點為保戶在高齡階段不致於負擔過高的保費","自然保費會隨年齡增長而逐漸提高，因此需提存大量之責任準備金","平準保費會使保戶在保險期間之初期繳交超過其實際年齡所應繳之保費"],"a":2,"c":"準備金、費率與再保"},{"id":"115-28","year":"115","n":28,"q":"由於民眾偏好保本的習性，為提升投資型保險商品的吸引力，在商品設計上會附有最低保證給付。若保險人保證契約期滿時，對於保單價值準備金會有最低保證金額，保障下檔風險（downside risk），此種保證是指下列何種設計？","o":["保證最低身故給付","保證最低提領給付","保證最低收入給付","保證最低滿期給付"],"a":3,"c":"投資型保險"},{"id":"115-29","year":"115","n":29,"q":"人壽保險單條款規範保險人對於要保人於訂立契約時有不實告知，足以影響其對於危險之估計者，於契約訂立後經過兩年，即不得解除契約。此規定是指下列何種條款？","o":["寬限期間條款","不可抗辯條款","全部契約條款","受益權利確保條款"],"a":1,"c":"契約條款與法規"},{"id":"115-30","year":"115","n":30,"q":"人壽保險主要為長期契約，而有所謂不喪失價值選擇權之適用，請問就目前人壽保險單示範條款的規定中，下列何者不屬於不喪失價值選擇權？","o":["自契約訂立或復效之日起二年後，被保險人故意自殺致死者，保險公司仍負給付身故保險金或喪葬費用保險金之責任","要保人終止契約時，保險費已付足達一年以上或繳費累積達有保單價值準備金時，保險公司應於接到通知後一個月內償付解約金","保險費累積達有保單價值準備金時，要保人得以當時保單價值準備金扣除營業費用後的數額作為一次繳清的躉繳保險費，申請改為減額繳清保險","保險費累積達有保單價值準備金時，要保人得以當時保單價值準備金扣除營業費用後的數額作為一次繳清的躉繳保險費，申請改為展期定期保險"],"a":0,"c":"不喪失價值與保單權益"},{"id":"115-31","year":"115","n":31,"q":"下列關於「保險業理賠聯盟鏈」服務機制的敘述，何者正確？①受益人授權透過壽險公會平臺轉送，即可同步向多家公司申請理賠②理賠聯盟鏈之服務範圍已全面涵蓋所有的產險及壽險之險種③線上申請後，理賠時無需再繳回任何紙本正本文件","o":["僅①","①②","②③","①③"],"a":0,"c":"保險科技與銷售通路"},{"id":"115-32","year":"115","n":32,"q":"下列關於勞工退休制度的確定給付制（ Defined Benefit, DB）與確定提撥制（Defined Contribution, DC）之比較的敘述，何者正確？①DB 制由雇主保證退休金給付數額，承擔財務風險②DC 制中，勞工自行承擔個人退休金帳戶投資盈虧③DC 制退休金金額係按年資與平均工資計算，由雇主負最終給付責任","o":["①②","僅③","②③","①③"],"a":0,"c":"退休、稅務、信託與執業"},{"id":"115-33","year":"115","n":33,"q":"吳先生投保終身壽險附加終身醫療險附約已滿十五年，因退休收入減少無法繼續繳納保費。吳先生目前 65 歲且健康狀況不佳，特別擔心近五年內可能發生不幸。若考量將保單積存之現金價值進行轉換，關於「展期定期保險」與「減額繳清保險」之區分，下列選項何者正確？①吳先生希望在近期內維持最高額度之保障，應選擇展期定期保險，其特性為維持原保額不變，僅將保障期間縮短至準備金能支應之期限②根據人身保險商品審查應注意事項第 197 點的規範，無論展期定期保險或減額繳清保險，都不影響附加終身醫療險附約的效力③若選擇減額繳清保險，則保額降低但保障終身，且繳費義務消滅。但吳先生若短期內身故，能獲得的理賠金額會低於選擇展期定期保險","o":["僅①","①②","僅③","①③"],"a":3,"c":"不喪失價值與保單權益"},{"id":"115-34","year":"115","n":34,"q":"下列關於分紅保單之「紅利分配方式」規範的敘述，何者正確？①根據金融監督管理委員會規定，保險公司每個會計年度結束後，須將該分紅保單所屬「區隔帳戶」的當年度可分配紅利，分配給要保人的比例不得低於 60% ②要保人於投保時可選擇現金給付、增額繳清、儲存生息或抵繳保費③目前市場上同時存在「美式分紅」與「英式分紅」保單。「增額紅利」是英式分紅保單的核心機制","o":["僅①","僅②","②③","①②"],"a":2,"c":"分紅與利率變動型"},{"id":"115-35","year":"115","n":35,"q":"林先生 60 歲，即將退休，有 300 萬元積蓄，希望有穩定現金流補充退休生活費，但平時忙於照顧孫子，無暇研究投資市場。王先生 35 歲，投資經驗豐富，希望自行選擇基金配置以追求較高報酬。下列敘述何者正確？①類全委保單由投信專業經理人代操，費用經常高於一般投資型保單②林先生適合一般投資型保單，王先生適合類全委保單③類全委保單多設有「撥回機制」，可定期提供保戶現金撥回","o":["僅①","①②","②③","①③"],"a":3,"c":"投資型保險"},{"id":"115-36","year":"115","n":36,"q":"林先生於 109 年 8 月投保一張投資型人壽保險，投保時年齡為 45 歲，保單帳戶價值為 200 萬元。若林先生於 115 年（即投保後第 6 年）欲再繳交一筆保險費，依最低比率規範，保險公司受理該筆保險費繳交前，其死亡給付對保單帳戶價值之比率應符合下列何者？","o":["不得低於 190%","不得低於 160%","不得低於 140%","不得低於 120%"],"a":3,"c":"投資型保險"},{"id":"115-37","year":"115","n":37,"q":"陳先生於 60 歲時投保「小額終老保險」，保額 90 萬元。根據該類商品目前之法規與契約條款規定，若陳先生於投保後第二年因疾病身故，關於保險公司應給付之金額，下列何者正確？","o":["因小額終老保險規範意外身故方能領取全額保險金，本案陳先生係因疾病致死且尚未屆滿三年限制，故保險公司不予給付九十萬元之全額保險金","根據保險契約中關於早期身故之一般性處理規範，若被保險人於投保後兩年內因病發生身故事故，保險公司僅需退還已繳之保費總額且不計利息","依據該類商品針對投保前三年疾病身故之限制條款，保險公司應按其已繳保險費總額之 1.025 倍給付身故保險金，作為此階段之最終給付金額","保險公司應根據該契約之總繳費年期與實際經過年數之比例，按比例核算並給付部分之身故保險金金額給受益人，而非按契約原始約定之保額理賠"],"a":2,"c":"壽險商品、小額終老與微型保險"},{"id":"115-38","year":"115","n":38,"q":"下列關於「變額壽險」與「變額萬能壽險」的敘述，何者正確？①變額壽險須依約定時間及金額固定繳費，變額萬能壽險則可根據財務狀況進行彈性繳款②變額壽險適合預算有限、收入不穩定的小資族；變額萬能壽險適合家庭責任重的三明治族③變額壽險適合無壽險需求、想投資者；變額萬能壽險適合想穩定累積退休金者","o":["僅①","①②","②③","①③"],"a":0,"c":"投資型保險"},{"id":"115-39","year":"115","n":39,"q":"若張先生投保壽險保單時，張太太（簡稱甲）為要保人，張先生為被保險人；受益人為甲。但投保後一年，兩人辦理離婚。離婚後三個月，張先生因意外事故死亡。關於此保險契約之效力及保險金之給付，依目前司法實務與保險法理見解，下列敘述何者正確？","o":["甲對其前夫已喪失法律上之保險利益，依保險法之相關規定，人身保險契約於婚姻關係終止後即告失效，保險公司依法無須負給付責任","人身保險之保險利益僅需於訂約時存在即可，故契約仍為有效，保險金應給付予原指定之受益人甲","保險契約雖然仍為有效，但因受益人身分已非配偶，其受領權應隨保險利益消滅，保險金應轉作為被保險人之遺產，由其全體繼承人平分","此屬保險契約重大變更，要保人應於離婚後辦理要保人變更作業，若未經保險公司書面同意，保險人得依誠信原則與危險增加主張契約無效"],"a":1,"c":"契約條款與法規"},{"id":"115-40","year":"115","n":40,"q":"依保險業辦理電子商務應注意事項第 14 條規定，保險業對於以網路投保之人身保險商品，關於收件通報作業之時點，下列何者正確？","o":["應於要保人填寫要保資料完成後，立即連線辦理收件通報","應於送出繳款資料並取得信用卡或轉帳銀行授權碼後，即時連線辦理收件通報","應於保險契約成立且扣款完成後二十四小時內，一併辦理收件通報及承保通報","應於保險公司完成人工核保作業且同意承保後，始得辦理收件通報"],"a":1,"c":"保險科技與銷售通路"}];

 <div class="card"><div class="cat">${q.c}</div><div class="q">${stem(q.q)}</div>${opts}${fb}${hint(q)}</div>${grid}
 <div class="nav"><button class="btn sec" id="pv" ${Q.i?'':'disabled'}>上一題</button>
 ${last?`<button class="btn" id="nx" ${each&&!shown?'disabled':''}>${each?'看成績':'交卷（已答 '+done+'/'+n+'）'}</button>`:`<button class="btn" id="nx" ${each&&!shown?'disabled':''}>下一題</button>`}</div>
 <button class="btn sec" id="qt">放棄並回首頁</button>`;
 $.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(each&&Q.ans[Q.i]!==undefined)return;Q.ans[Q.i]=+b.dataset.k;render()});
 $.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{Q.i=+b.dataset.g;render()});
 document.getElementById('pv').onclick=()=>{Q.i--;render()};
 document.getElementById('nx').onclick=()=>{if(last){if(!each&&done<n)ask('還有 '+(n-done)+' 題未作答，確定交卷？','交卷',result);else result()}else{Q.i++;render();scrollTo(0,0)}};document.getElementById('bk').onclick=leave;
 document.getElementById('qt').onclick=leave;
}
function result(){
 const n=Q.list.length;let c=0;const ok=new Set();
 Q.list.forEach((q,i)=>{if(Q.ans[i]===q.a){c++;ok.add(q.id)}});
 saveWrong(Q.list.map(q=>q.id),ok);
 const rv=Q.list.map((q,i)=>{const a=Q.ans[i],r=a===q.a;
  return `<div class="rv"><div class="meta"><span>第 ${i+1} 題<span class="tag">${q.year} 年第 ${q.n} 題</span><span class="tag">${q.c}</span></span><span class="fb ${r?'ok':'no'}">${r?'✔ 正確':a===undefined?'✘ 未作答':'✘ 錯誤'}</span></div>
  <div class="q">${stem(q.q)}</div>${q.o.map((t,k)=>`<div class="opt ${k==q.a?'ok':k===a?'no':''}"><b>${L[k]}</b>${esc(t)}${k==q.a?' ✔':k===a?' （你的答案）':''}</div>`).join('')}</div>`}).join('');
 $.innerHTML=`<div class="card score"><div class="sub">本次成績</div><div class="n">${c} / ${n}</div><div class="sub">答對 ${c} 題，答錯 ${n-c} 題，答對率 ${Math.round(c/n*100)}%</div></div>
 <div class="nav"><button class="btn" id="again">再測一次</button><button class="btn sec" id="hm">回首頁</button></div>
 <div class="card"><b>逐題解答</b>${rv}</div>`;
 document.getElementById('again').onclick=start;document.getElementById('hm').onclick=home;scrollTo(0,0);
}
home();
</script></body></html>
